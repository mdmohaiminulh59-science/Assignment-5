name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: B14-A05-DevStack-main/devstack/package-lock.json

      - name: Install dependencies
        working-directory: ./B14-A05-DevStack-main/devstack
        run: npm install

      - name: Build
        working-directory: ./B14-A05-DevStack-main/devstack
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./B14-A05-DevStack-main/devstack/dist
